name: Pull request test environment

# Deploys an isolated LDES server + LDIO + PostgreSQL environment for a pull request, runs a
# load test against it and reports the result back on the pull request.
#
# The environment is torn down at the end of the run. Add the `keep-environment` label to a pull
# request to keep it around for manual inspection; pr-test-environment-cleanup.yml destroys it
# when the pull request is closed either way.
#
# It can also be run manually against any branch, which deploys a standalone environment under the
# name given as input instead of "pr-<number>". Such an environment has no pull request to be
# closed, so pr-test-environment-cleanup.yml never picks it up: a manual run kept with
# `keep-environment` has to be destroyed by running this workflow again without it.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment-name:
        description: Name of the environment. Must be a DNS label of at most 32 characters.
        required: true
        default: manual
        type: string
      keep-environment:
        description: Keep the environment after the run instead of destroying it.
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

# Manual runs share the group with the pull request environment of the same name, so a run can
# never overlap with the cleanup workflow or with another run touching the same Terraform state.
concurrency:
  group: ldes-environment-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.environment-name }}
  cancel-in-progress: false

env:
  OVH_ENDPOINT: ${{ vars.OVH_ENDPOINT }}
  OVH_APPLICATION_KEY: ${{ secrets.OVH_APPLICATION_KEY }}
  OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
  OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
  TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'
  ENVIRONMENT_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.environment-name }}
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  KUBECTL_VERSION: v1.31.2
  K6_VERSION: v0.54.0

jobs:
  test-environment:
    name: Deploy and load test
    runs-on: ubuntu-latest

    # Pull requests from forks cannot access the secrets needed to reach OVHcloud. Manual runs are
    # always on a branch of this repository, so only the pull request event needs the check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      # The environment name ends up in a Terraform state key, a namespace and a hostname. Catching
      # a bad manual input here avoids leaving a stray state object behind for a run that can only
      # fail on the environment_name validation of the stack later on.
      - name: Check the environment name
        run: |
          set -eu
          if ! printf '%s' "$ENVIRONMENT_NAME" | grep -Eq '^[a-z0-9]([-a-z0-9]{0,30}[a-z0-9])?$'; then
              echo "::error::'${ENVIRONMENT_NAME}' is not a valid environment name:" \
                  "use a DNS label of at most 32 characters (lowercase alphanumerics and '-')." >&2
              exit 1
          fi

      - name: Install kubectl and k6
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"

          curl -fsSL -o "${RUNNER_TEMP}/bin/kubectl" \
              "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "${RUNNER_TEMP}/bin/kubectl"

          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
              | tar -xz -C "${RUNNER_TEMP}" --strip-components=1 "k6-${K6_VERSION}-linux-amd64/k6"
          mv "${RUNNER_TEMP}/k6" "${RUNNER_TEMP}/bin/k6"
          chmod +x "${RUNNER_TEMP}/bin/k6"

          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Initialise the platform stack
        uses: ./.github/actions/terraform-setup
        with:
          stack: platform
          state-key: platform/terraform.tfstate
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-region: ${{ vars.TF_STATE_REGION }}
          state-endpoint: ${{ vars.TF_STATE_ENDPOINT }}

      - name: Fetch the cluster credentials
        run: |
          set -euo pipefail
          umask 077

          # `terraform output` exits 0 with only a warning when the state is empty, so the
          # emptiness of the kubeconfig is what tells us the platform was never applied.
          terraform -chdir=terraform/stacks/platform output -raw kubeconfig > "${RUNNER_TEMP}/kubeconfig"

          if [ ! -s "${RUNNER_TEMP}/kubeconfig" ]; then
              echo "::error::The platform stack has no usable state: no kubeconfig output was found." \
                  "Run the Platform workflow on main (or with workflow_dispatch in apply mode) before" \
                  "deploying a pull request environment." >&2
              exit 1
          fi

          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "$GITHUB_ENV"

      - name: Initialise the environment stack
        id: env-init
        uses: ./.github/actions/terraform-setup
        with:
          stack: environment
          state-key: environments/${{ env.ENVIRONMENT_NAME }}/terraform.tfstate
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-region: ${{ vars.TF_STATE_REGION }}
          state-endpoint: ${{ vars.TF_STATE_ENDPOINT }}

      - name: Point the stack at the platform and add-ons state
        run: ./scripts/write-remote-state-vars.sh terraform/stacks/environment platform addons

      - name: Deploy the environment
        id: deploy
        working-directory: terraform/stacks/environment
        env:
          LDES_BASE_DOMAIN: ${{ vars.LDES_BASE_DOMAIN }}
          LDES_SERVER_IMAGE: ${{ vars.LDES_SERVER_IMAGE }}
          LDES_SERVER_IMAGE_TAG: ${{ vars.LDES_SERVER_IMAGE_TAG }}
          LDIO_IMAGE: ${{ vars.LDIO_IMAGE }}
          LDIO_IMAGE_TAG: ${{ vars.LDIO_IMAGE_TAG }}
          CONFIGURE_STREAMS_WITH_CHART: ${{ vars.CONFIGURE_STREAMS_WITH_CHART || 'true' }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          ../../../scripts/write-environment-vars.sh .

          terraform apply -auto-approve -no-color -lock-timeout=10m

          {
              echo "ldes-server-url=$(terraform output -raw ldes_server_url)"
              echo "namespace=$(terraform output -raw namespace)"
              echo "view-urls=$(terraform output -json view_urls | jq -r 'join(" ")')"
              echo "streams=$(terraform output -json stream_names | jq -r 'join(", ")')"
              echo "sink-tables=$(terraform output -json sink_tables | jq -r 'join(", ")')"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for the LDES server to serve every view
        run: ./scripts/wait-for-ldes-server.sh 900 ${{ steps.deploy.outputs.view-urls }}

      - name: Ingest the realistic basis
        id: seed
        continue-on-error: true
        working-directory: loadtest
        env:
          LDES_SERVER_URL: ${{ steps.deploy.outputs.ldes-server-url }}
          MEMBER_SCALE: ${{ vars.LOADTEST_MEMBER_SCALE || '1' }}
        run: k6 run --no-usage-report seed.js

      - name: Run the load test
        id: loadtest
        continue-on-error: true
        working-directory: loadtest
        env:
          LDES_SERVER_URL: ${{ steps.deploy.outputs.ldes-server-url }}
          MEMBER_SCALE: ${{ vars.LOADTEST_MEMBER_SCALE || '1' }}
          INGEST_VUS: ${{ vars.LOADTEST_INGEST_VUS || '1' }}
          INGEST_MAX_DURATION_SECONDS: ${{ vars.LOADTEST_INGEST_MAX_DURATION_SECONDS || '600' }}
          QUERY_VUS: ${{ vars.LOADTEST_QUERY_VUS || '10' }}
          QUERY_RATE: ${{ vars.LOADTEST_QUERY_RATE || '20' }}
          QUERY_DURATION_SECONDS: ${{ vars.LOADTEST_QUERY_DURATION_SECONDS || '120' }}
          SETTLE_SECONDS: ${{ vars.LOADTEST_SETTLE_SECONDS || '45' }}
          INGEST_P95_MS: ${{ vars.LOADTEST_INGEST_P95_MS || '2000' }}
          QUERY_P95_MS: ${{ vars.LOADTEST_QUERY_P95_MS || '3000' }}
        run: k6 run --no-usage-report ldes-loadtest.js

      - name: Wait for LDIO and validate the PostgreSQL sink
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail

          node scripts/generate-sink-sql.js \
              --catalog catalog/streams.json \
              --seed loadtest/seed-summary.json \
              --loadtest loadtest/loadtest-metrics.json \
              --out reports/sql

          SINK_DATABASE_URI="$(terraform -chdir=terraform/stacks/environment output -raw sink_database_uri)"
          export SINK_DATABASE_URI

          ./scripts/verify-sink.sh \
              "${{ steps.deploy.outputs.namespace }}" \
              reports/sql \
              reports \
              "${{ vars.LOADTEST_REPLICATION_TIMEOUT_SECONDS || '900' }}"

      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        run: |
          set -eu
          # The deploy step only publishes its outputs after a successful apply, so fall back to
          # the namespace the environment stack derives from the environment name. Without this
          # the diagnostics are empty exactly when a deployment failed.
          ns="${{ steps.deploy.outputs.namespace }}"
          ns="${ns:-ldes-${ENVIRONMENT_NAME}}"
          [ -n "${KUBECONFIG:-}" ] || exit 0
          mkdir -p diagnostics
          kubectl -n "$ns" get all > diagnostics/resources.txt 2>&1 || true
          kubectl -n "$ns" describe pods > diagnostics/pods.txt 2>&1 || true
          kubectl -n "$ns" get events --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
          kubectl -n "$ns" logs deployment/openldes-server --tail=500 > diagnostics/ldes-server.log 2>&1 || true
          kubectl -n "$ns" logs deployment/openldes-ldio --tail=500 > diagnostics/ldio.log 2>&1 || true
          kubectl -n "$ns" logs --previous deployment/openldes-ldio --tail=500 > diagnostics/ldio-previous.log 2>&1 || true

          # LDIO replicates over the public ingress hostname, so a pod must be able to reach the
          # load balancer it resolves to. Compare that against the cluster-internal service to tell
          # a broken ingress apart from a hairpinning problem.
          host="$(kubectl -n "$ns" get ingress -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || true)"
          if [ -n "$host" ]; then
              kubectl -n "$ns" delete pod ldes-connectivity-check --ignore-not-found >/dev/null 2>&1 || true
              kubectl -n "$ns" run ldes-connectivity-check --image=alpine/curl:latest --restart=Never \
                  --command -- sh -c "
                      echo 'resolving ${host}'; nslookup '${host}' || true
                      echo 'public ingress:'
                      curl -sS -m 30 -o /dev/null -w 'status=%{http_code} time=%{time_total}\n' \"http://${host}/\" || echo 'UNREACHABLE'
                      echo 'internal service:'
                      curl -sS -m 30 -o /dev/null -w 'status=%{http_code} time=%{time_total}\n' \"http://openldes-server.${ns}.svc.cluster.local:8080/\" || echo 'UNREACHABLE'
                  " >/dev/null 2>&1 || true

              for _ in $(seq 1 20); do
                  phase="$(kubectl -n "$ns" get pod ldes-connectivity-check -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                  case "$phase" in Succeeded|Failed) break ;; esac
                  sleep 5
              done

              kubectl -n "$ns" logs ldes-connectivity-check > diagnostics/connectivity.txt 2>&1 || true
              kubectl -n "$ns" delete pod ldes-connectivity-check --ignore-not-found >/dev/null 2>&1 || true
          fi

          # Surface the most useful parts in the job log as well, so a failed run is diagnosable
          # without downloading the artefact.
          for f in diagnostics/connectivity.txt diagnostics/resources.txt diagnostics/events.txt diagnostics/ldio.log; do
              [ -s "$f" ] || continue
              echo "::group::$f"
              tail -100 "$f"
              echo "::endgroup::"
          done

      - name: Build and validate the report
        id: report
        if: always()
        continue-on-error: true
        env:
          ENVIRONMENT_NAME: ${{ env.ENVIRONMENT_NAME }}
          LDES_SERVER_URL: ${{ steps.deploy.outputs.ldes-server-url }}
          MAX_INGEST_P95_MS: ${{ vars.REPORT_MAX_INGEST_P95_MS || '2000' }}
          MAX_INGEST_MAX_MS: ${{ vars.REPORT_MAX_INGEST_MAX_MS || '15000' }}
          MAX_QUERY_P95_MS: ${{ vars.REPORT_MAX_QUERY_P95_MS || '3000' }}
          MAX_QUERY_MAX_MS: ${{ vars.REPORT_MAX_QUERY_MAX_MS || '15000' }}
          MAX_VIEW_P95_MS: ${{ vars.REPORT_MAX_VIEW_P95_MS || '5000' }}
          MAX_REPLICATION_SECONDS: ${{ vars.REPORT_MAX_REPLICATION_SECONDS || '600' }}
          MIN_INGEST_COMPLETION: ${{ vars.REPORT_MIN_INGEST_COMPLETION || '0.95' }}
          MAX_INGEST_FAILURES: ${{ vars.REPORT_MAX_INGEST_FAILURES || '0' }}
          MAX_QUERY_FAILURES: ${{ vars.REPORT_MAX_QUERY_FAILURES || '0' }}
        run: |
          set -o pipefail
          node scripts/build-report.js --out report.md --json reports/report.json > /dev/null

      - name: Publish the report
        if: always()
        run: |
          set -eu
          if [ ! -s report.md ]; then
            {
              echo "## LDES test environment \`${ENVIRONMENT_NAME}\`"
              echo
              echo "The run failed before a report could be built. See the job log and the diagnostics artefact."
            } > report.md
          fi

          {
            echo
            echo "_Commit ${COMMIT_SHA} — [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } >> report.md

          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        # A manual run has no pull request to comment on; its report is in the job summary.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-${{ env.ENVIRONMENT_NAME }}-${{ github.run_id }}
          path: |
            loadtest/seed-summary.json
            loadtest/loadtest-summary.json
            loadtest/loadtest-summary.md
            loadtest/loadtest-metrics.json
            reports/
            report.md
            diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Destroy the environment
        # Without an initialised backend there is nothing to destroy, and terraform would only add
        # a confusing "Backend initialization required" failure on top of the real one.
        # `inputs.keep-environment` is null outside a manual run and the label list is empty
        # outside a pull request, so each of the two opt-outs only applies to its own event.
        if: >-
          always() && steps.env-init.outcome == 'success'
          && !contains(github.event.pull_request.labels.*.name, 'keep-environment')
          && !inputs.keep-environment
        working-directory: terraform/stacks/environment
        env:
          LDES_BASE_DOMAIN: ${{ vars.LDES_BASE_DOMAIN }}
          LDES_SERVER_IMAGE: ${{ vars.LDES_SERVER_IMAGE }}
          LDES_SERVER_IMAGE_TAG: ${{ vars.LDES_SERVER_IMAGE_TAG }}
          LDIO_IMAGE: ${{ vars.LDIO_IMAGE }}
          LDIO_IMAGE_TAG: ${{ vars.LDIO_IMAGE_TAG }}
          CONFIGURE_STREAMS_WITH_CHART: ${{ vars.CONFIGURE_STREAMS_WITH_CHART || 'true' }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Re-written here as well so the teardown still works when the deploy step failed
          # before it got a chance to write the file.
          ../../../scripts/write-environment-vars.sh .
          terraform destroy -auto-approve -no-color -lock-timeout=10m

      - name: Fail when any stage of the run failed
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
              echo "The environment could not be deployed, so the load test never ran." >&2
              exit 1
          fi
          if [ "${{ steps.seed.outcome }}" != "success" ]; then
              echo "The realistic basis could not be ingested." >&2
              exit 1
          fi
          if [ "${{ steps.loadtest.outcome }}" != "success" ]; then
              echo "The load test did not meet its k6 thresholds." >&2
              exit 1
          fi
          if [ "${{ steps.verify.outcome }}" != "success" ]; then
              echo "The PostgreSQL sink could not be validated." >&2
              exit 1
          fi
          if [ "${{ steps.report.outcome }}" != "success" ]; then
              echo "The report found a data quality issue or a breached time metric." >&2
              exit 1
          fi
